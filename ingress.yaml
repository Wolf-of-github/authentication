apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authentication
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: default-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - shop-hr.com
      secretName: shop-hr-tls
  rules:
    - host: shop-hr.com
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: authentication
                port:
                  number: 80